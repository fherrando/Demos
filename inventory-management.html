<script>
(function(){
  'use strict';

  var raw = JSON.parse(document.getElementById('app-data').textContent);
  var state = { productos: raw.productos, lastUpdated: raw.lastUpdated };

  var ui = { tab: 'stock', search: '', searchFocusId: null, filter: 'todos', claseFilter: null, top10Filter: false, provFilter: null, tipoFilter: null, monthFilter: null, infoOpen: null, sortField: 'vencimiento', sortDir: 'asc', page: 1, vencPage: 1, stockPage: 1, provPage: 1 };
  var PANEL_PAGE_SIZE = 6;
  var PAGE_SIZE = 10;
  var COLUMNS = [
    { key:'nombre', label:'Artículo', align:'' },
    { key:'tipo', label:'Tipo', align:'' },
    { key:'vencimiento', label:'Vencimiento', align:'' },
    { key:'stock', label:'Stock', align:'' },
    { key:'ubicacion', label:'Ubicación', align:'' },
    { key:'costo', label:'Costo', align:'right' },
    { key:'precioVenta', label:'Precio venta', align:'right' },
    { key:'valor', label:'Valor en stock', align:'right' }
  ];

  var downloadsApi = null;
  var downloadsReady = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
  downloadsReady.then(function(api){ downloadsApi = api; });

  var CUR = new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 });
  var DATEFMT = new Intl.DateTimeFormat('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function fmtMoney(n){ return CUR.format(Math.round(Number(n) || 0)); }
  function fmtMoneyOrDash(n){ return (Number(n) > 0) ? fmtMoney(n) : '—'; }
  function fmtPct1(n){ return (Math.round((Number(n)||0)*10)/10).toLocaleString('es-AR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%'; }
  function stockLabel(p){ var min = Number(p.stockMinimo) || 0; return min > 0 ? (p.stock + ' / mín. ' + min) : (p.stock + ' (sin mínimo definido)'); }
  function fmtDate(iso){ if(!iso) return '—'; var d = new Date(iso + 'T00:00:00'); return DATEFMT.format(d); }
  function startOfToday(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function diffDays(iso){
    if(!iso) return null;
    var v = new Date(iso + 'T00:00:00');
    var t = startOfToday();
    return Math.round((v - t) / 86400000);
  }
  function vencStatus(iso){
    var d = diffDays(iso);
    if(d === null) return { key:'sinvencer', d:d };
    if(d < 0) return { key:'vencido', d:d };
    if(d <= 30) return { key:'critico', d:d };
    if(d <= 90) return { key:'alerta', d:d };
    return { key:'ok', d:d };
  }
  function stockStatus(p){
    var min = Number(p.stockMinimo) || 0;
    var stock = Number(p.stock) || 0;
    if(stock <= 0) return 'critico';
    if(min > 0 && stock < min * 0.5) return 'critico';
    if(min > 0 && stock < min) return 'alerta';
    return 'ok';
  }
  function vencLabel(vs){
    if(vs.key === 'sinvencer') return 'Sin vencimiento';
    if(vs.key === 'vencido') return 'Vencido hace ' + Math.abs(vs.d) + (Math.abs(vs.d) === 1 ? ' día' : ' días');
    if(vs.d === 0) return 'Vence hoy';
    return 'Vence en ' + vs.d + (vs.d === 1 ? ' día' : ' días');
  }
  function vencPillClass(vs){
    if(vs.key === 'vencido') return 'pill pill-expired';
    if(vs.key === 'critico') return 'pill pill-critical';
    if(vs.key === 'alerta') return 'pill pill-warning';
    if(vs.key === 'sinvencer') return 'pill pill-neutral';
    return 'pill pill-good';
  }
  function stockPillClass(ss){
    if(ss === 'critico') return 'pill pill-critical';
    if(ss === 'alerta') return 'pill pill-warning';
    return 'pill pill-good';
  }
  function tipoOf(p){ return p.tipo || 'Sin clasificar'; }
  function monthsDaysLabel(d){
    if(d === null) return '';
    if(d < 0){ var ad = Math.abs(d); return 'Vencido hace ' + ad + (ad === 1 ? ' día' : ' días'); }
    if(d === 0) return 'Vence hoy';
    var months = Math.floor(d / 30.4368);
    var days = Math.round(d - months * 30.4368);
    if(days >= 30){ months += 1; days -= 30; }
    if(months <= 0) return 'Vence en ' + d + (d === 1 ? ' día' : ' días');
    var out = months + (months === 1 ? ' mes' : ' meses');
    if(days > 0) out += ' y ' + days + (days === 1 ? ' día' : ' días');
    return 'Vence en ' + out;
  }
  var MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function monthlyExpiryBuckets(rows){
    var today = startOfToday();
    var vencido = { n:0, valor:0 };
    var months = [];
    for(var i=0;i<12;i++){
      var d = new Date(today.getFullYear(), today.getMonth()+i, 1);
      months.push({ year:d.getFullYear(), month:d.getMonth(), n:0, valor:0 });
    }
    rows.forEach(function(r){
      if(!r.p.vencimiento) return;
      var dd = r.vs.d;
      var valor = (Number(r.p.costo)||0) * (Number(r.p.stock)||0);
      if(dd < 0){ vencido.n++; vencido.valor += valor; return; }
      var v = new Date(r.p.vencimiento + 'T00:00:00');
      var diffMonths = (v.getFullYear()-today.getFullYear())*12 + (v.getMonth()-today.getMonth());
      if(diffMonths >= 0 && diffMonths < 12){ months[diffMonths].n++; months[diffMonths].valor += valor; }
    });
    return { vencido: vencido, months: months };
  }
  function monthBucketKey(r){
    if(!r.p.vencimiento) return null;
    var today = startOfToday();
    if(r.vs.d < 0) return 'vencido';
    var v = new Date(r.p.vencimiento + 'T00:00:00');
    var diffMonths = (v.getFullYear()-today.getFullYear())*12 + (v.getMonth()-today.getMonth());
    if(diffMonths >= 0 && diffMonths < 12) return diffMonths;
    return null;
  }
  function monthFilterLabel(key, buckets){
    if(key === 'vencido') return 'Vencido';
    var m = buckets.months[key];
    if(!m) return '';
    return MESES_CORTOS[m.month] + ' de ' + m.year;
  }

  function claseMap(){
    var items = state.productos.map(function(p){
      return { id: p.id, valor: (Number(p.costo)||0) * (Number(p.stock)||0) };
    });
    var total = items.reduce(function(s,it){ return s + it.valor; }, 0);
    var sorted = items.slice().sort(function(a,b){ return b.valor - a.valor; });
    var map = {};
    var cum = 0;
    sorted.forEach(function(it){
      cum += it.valor;
      var pct = total > 0 ? (cum / total * 100) : 0;
      map[it.id] = pct <= 80 ? 'A' : (pct <= 95 ? 'B' : 'C');
    });
    return map;
  }

  function top10Ids(){
    var items = state.productos.map(function(p){
      return { id: p.id, valor: (Number(p.costo)||0) * (Number(p.stock)||0) };
    });
    var sorted = items.slice().sort(function(a,b){ return b.valor - a.valor; });
    var ids = {};
    sorted.slice(0, 10).forEach(function(it){ ids[it.id] = true; });
    return ids;
  }

  function computed(){
    var cm = claseMap();
    var t10 = top10Ids();
    return state.productos.map(function(p){
      return { p:p, vs:vencStatus(p.vencimiento), ss:stockStatus(p), clase: cm[p.id], isTop10: !!t10[p.id] };
    });
  }

  function toast(msg){
    var el = document.querySelector('.toast');
    if(el) el.remove();
    el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 4200);
  }


  function searchPredicate(r, q){
    return (r.p.nombre + ' ' + r.p.laboratorio + ' ' + r.p.lote).toLowerCase().indexOf(q) !== -1;
  }

  function sortRows(rows){
    var dir = ui.sortDir === 'desc' ? -1 : 1;
    var f = ui.sortField;
    rows.sort(function(a,b){
      if(f === 'nombre') return dir * a.p.nombre.localeCompare(b.p.nombre, 'es');
      if(f === 'tipo') return dir * tipoOf(a.p).localeCompare(tipoOf(b.p), 'es');
      if(f === 'ubicacion') return dir * String(a.p.ubicacion||'').localeCompare(String(b.p.ubicacion||''), 'es');
      if(f === 'stock') return dir * (a.p.stock - b.p.stock);
      if(f === 'costo') return dir * (a.p.costo - b.p.costo);
      if(f === 'precioVenta') return dir * (a.p.precioVenta - b.p.precioVenta);
      if(f === 'valor') return dir * ((a.p.costo*a.p.stock) - (b.p.costo*b.p.stock));
      var av = a.vs.d === null ? Infinity : a.vs.d, bv = b.vs.d === null ? Infinity : b.vs.d;
      return dir * (av - bv);
    });
    return rows;
  }

  function filteredRows(){
    var rows = computed();
    var q = ui.search.trim().toLowerCase();
    if(q) rows = rows.filter(function(r){ return searchPredicate(r, q); });
    if(ui.claseFilter){
      rows = rows.filter(function(r){ return r.clase === ui.claseFilter; });
    }
    if(ui.top10Filter){
      rows = rows.filter(function(r){ return r.isTop10; });
    }
    if(ui.provFilter){
      rows = rows.filter(function(r){ return (r.p.laboratorio || 'Sin laboratorio') === ui.provFilter; });
    }
    if(ui.tipoFilter){
      rows = rows.filter(function(r){ return tipoOf(r.p) === ui.tipoFilter; });
    }
    if(ui.filter === 'vencer'){
      rows = rows.filter(function(r){ return r.vs.key === 'critico' || r.vs.key === 'alerta' || r.vs.key === 'vencido'; });
    } else if(ui.filter === 'vencidos'){
      rows = rows.filter(function(r){ return r.vs.key === 'vencido'; });
    } else if(ui.filter === 'stock'){
      rows = rows.filter(function(r){ return r.ss !== 'ok'; });
    }
    return sortRows(rows);
  }

  function kpis(){
    var rows = computed();
    var total = rows.length;
    var valor = rows.reduce(function(s,r){ return s + (r.p.costo * r.p.stock); }, 0);
    var porVencer = rows.filter(function(r){ return r.vs.key !== 'ok' && r.vs.key !== 'sinvencer'; });
    var stockBajo = rows.filter(function(r){ return r.ss !== 'ok'; });
    var vencTone = porVencer.some(function(r){ return r.vs.key === 'vencido' || r.vs.key === 'critico'; }) ? 'critical' : (porVencer.length ? 'warning' : 'good');
    var stockTone = stockBajo.some(function(r){ return r.ss === 'critico'; }) ? 'critical' : (stockBajo.length ? 'warning' : 'good');
    var topCost = null;
    rows.forEach(function(r){ if(!topCost || Number(r.p.costo) > Number(topCost.p.costo)) topCost = r; });
    var buckets12m = monthlyExpiryBuckets(rows);
    var valorRiesgo12m = buckets12m.vencido.valor + buckets12m.months.reduce(function(s,b){ return s + b.valor; }, 0);
    var nRiesgo12m = buckets12m.vencido.n + buckets12m.months.reduce(function(s,b){ return s + b.n; }, 0);
    return { total: total, valor: valor, porVencer: porVencer.length, stockBajo: stockBajo.length, vencTone: vencTone, stockTone: stockTone, topCost: topCost, valorRiesgo12m: valorRiesgo12m, nRiesgo12m: nRiesgo12m };
  }

  function renderKpisStock(k){
    return '' +
    '<div class="kpis-2">' +
      '<div class="kpi"><div class="kpi-label">Artículos</div><div class="kpi-value mono">' + k.total + '</div><div class="kpi-sub">en el piloto</div></div>' +
      '<div class="kpi"><div class="kpi-label">Valor de inventario</div><div class="kpi-value mono">' + fmtMoney(k.valor) + '</div><div class="kpi-sub">costo × stock actual</div></div>' +
    '</div>';
  }

  function renderKpisVencimientos(k){
    return '' +
    '<div class="kpis-2">' +
      '<div class="kpi tone-' + k.vencTone + '"><div class="kpi-label">Por vencer (foco inmediato)</div><div class="kpi-value mono">' + k.porVencer + '</div><div class="kpi-sub">vencidos o ≤ 90 días</div></div>' +
      '<div class="kpi tone-warning"><div class="kpi-label">Valor en riesgo (12 meses)</div><div class="kpi-value mono">' + fmtMoney(k.valorRiesgo12m) + '</div><div class="kpi-sub">' + k.nRiesgo12m + ' artículo' + (k.nRiesgo12m === 1 ? '' : 's') + ' vencido' + (k.nRiesgo12m === 1 ? '' : 's') + ' o que vencen dentro del año</div></div>' +
    '</div>';
  }

  function renderKpisFoco(k){
    var spotlight = '';
    if(k.topCost){
      var p = k.topCost.p;
      spotlight = '' +
      '<div class="kpi">' +
        '<div class="kpi-label">Artículo más caro (por unidad)</div>' +
        '<div class="kpi-spotlight-name" style="font-size:.92rem;">' + esc(p.nombre) + '</div>' +
        '<div class="kpi-value mono">' + fmtMoney(p.costo) + '</div>' +
        '<div class="kpi-sub">' + esc(p.laboratorio) + ' · Lote ' + esc(p.lote) + '</div>' +
      '</div>';
    }
    return '' +
    '<div class="kpis-2">' +
      '<div class="kpi tone-' + k.stockTone + '"><div class="kpi-label">Stock bajo</div><div class="kpi-value mono">' + k.stockBajo + '</div><div class="kpi-sub">bajo el mínimo definido</div></div>' +
      spotlight +
    '</div>';
  }

  function panelPager(pageKey, totalCount, totalPages, pageSize){
    var page = ui[pageKey];
    var from = (page - 1) * pageSize + 1;
    var to = Math.min(page * pageSize, totalCount);
    return '' +
    '<div class="panel-pager">' +
      '<span class="panel-pager-info">' + from + '–' + to + ' de ' + totalCount + '</span>' +
      '<div class="panel-pager-controls">' +
        '<button type="button" class="btn btn-sm" data-panel-prev="' + pageKey + '"' + (page <= 1 ? ' disabled' : '') + '>‹</button>' +
        '<span class="panel-pager-page">' + page + ' / ' + totalPages + '</span>' +
        '<button type="button" class="btn btn-sm" data-panel-next="' + pageKey + '"' + (page >= totalPages ? ' disabled' : '') + '>›</button>' +
      '</div>' +
    '</div>';
  }

  function applyGlobalFilters(rows){
    if(ui.claseFilter) rows = rows.filter(function(r){ return r.clase === ui.claseFilter; });
    if(ui.top10Filter) rows = rows.filter(function(r){ return r.isTop10; });
    if(ui.provFilter) rows = rows.filter(function(r){ return (r.p.laboratorio || 'Sin laboratorio') === ui.provFilter; });
    if(ui.tipoFilter) rows = rows.filter(function(r){ return tipoOf(r.p) === ui.tipoFilter; });
    return rows;
  }

  function renderStockBajoPanel(){
    var rows = applyGlobalFilters(computed());
    var q = ui.search.trim().toLowerCase();
    var stockAll = rows.filter(function(r){ return r.ss !== 'ok'; });
    var stock = (q ? stockAll.filter(function(r){ return searchPredicate(r,q); }) : stockAll)
      .sort(function(a,b){ return (a.p.stock - a.p.stockMinimo) - (b.p.stock - b.p.stockMinimo); });

    var body;
    if(!stock.length){
      body = (q && stockAll.length) ?
        '<div class="panel-empty" style="color:var(--muted);">Sin coincidencias para “' + esc(ui.search.trim()) + '”</div>' :
        '<div class="panel-empty">✓ Ningún artículo con stock bajo</div>';
    } else {
      var totalPages = Math.max(1, Math.ceil(stock.length / PANEL_PAGE_SIZE));
      if(ui.stockPage > totalPages) ui.stockPage = totalPages;
      if(ui.stockPage < 1) ui.stockPage = 1;
      var startIdx = (ui.stockPage - 1) * PANEL_PAGE_SIZE;
      var shown = stock.slice(startIdx, startIdx + PANEL_PAGE_SIZE);
      var html = shown.map(function(r){

  function renderVencimientosChart(){

        '<div class="mchart-bar-wrap"><div class="mchart-bar" style="height:' + h + '%;background:var(' + tone + ');"></div></div>' +
        '<div class="mchart-label">' + esc(label) + '<br><span class="mono">' + (n || '—') + '</span></div>' +

  function concentracionMetrics(){
    var cm = claseMap();
    var items = state.productos.map(function(p){
      return { p:p, valor: (Number(p.costo)||0) * (Number(p.stock)||0), vs: vencStatus(p.vencimiento), clase: cm[p.id] };
    });
    var totalValor = items.reduce(function(s,it){ return s + it.valor; }, 0);
    var byValorDesc = items.slice().sort(function(a,b){ return b.valor - a.valor; });

    var classCount = { A:0, B:0, C:0 }, classValor = { A:0, B:0, C:0 };
    items.forEach(function(it){ classCount[it.clase]++; classValor[it.clase] += it.valor; });

    var cum = 0;
    var paretoTop = [];
    byValorDesc.forEach(function(it, i){
      cum += it.valor;
      var cumPct = totalValor > 0 ? (cum / totalValor * 100) : 0;
      if(i < 10) paretoTop.push({ id: it.p.id, nombre: it.p.nombre, laboratorio: it.p.laboratorio, valor: it.valor, pct: totalValor>0 ? it.valor/totalValor*100 : 0, cumPct: cumPct });
    });

    var labMap = {};
    items.forEach(function(it){
      var l = it.p.laboratorio || 'Sin laboratorio';
      if(!labMap[l]) labMap[l] = { laboratorio:l, n:0, valor:0 };
      labMap[l].n++; labMap[l].valor += it.valor;
    });
    var labsAll = Object.keys(labMap).map(function(k){ return labMap[k]; }).sort(function(a,b){ return b.valor - a.valor; });

    var top10Pct = paretoTop.length ? paretoTop[paretoTop.length-1].cumPct : 0;

    return {
      totalValor: totalValor, n: items.length, paretoTop: paretoTop,
      classCount: classCount, classValor: classValor,
      labsAll: labsAll, top10Pct: top10Pct, topLab: labsAll[0]
    };
  }

    return '' +

    '</div>' +
    kpisHtml +
    '<div class="panels">' +
      '<div class="panel">' + panelHeading('top10', '¿Dónde está concentrado el valor?') + '<div class="panel-sub">Los 10 artículos individuales (no un rubro ni categoría) que, por sí solos, más valor representan en el stock (costo × cantidad).</div>' + paretoRows + '</div>' +
      '<div class="panel">' + panelHeading('proveedor', 'Concentración por proveedor') + '<div class="panel-sub">Valor de stock por laboratorio: cuánto le compramos, en plata, a cada uno.</div>' + provRows + '</div>' +
    '</div>';

  function renderTable(){

    var rows = allRows.slice(startIdx, startIdx + PAGE_SIZE);
    var head = '<thead><tr>' +

        var arrow = active ? (ui.sortDir === 'desc' ? '↓' : '↑') : '↕';
        return '<th class="' + c.align + '"><button type="button" class="th-sort" data-sort="' + c.key + '">' + c.label + '<span class="sort-arrow' + (active ? ' active' : '') + '">' + arrow + '</span></button></th>';
      }).join('') +
      '</tr></thead>';
    var body = rows.map(function(r){
      var p = r.p, vs = r.vs, ss = r.ss;
      var min = Number(p.stockMinimo) || 0;
      var pct = min > 0 ? Math.max(0, Math.min(100, Math.round((p.stock / (min * 1.5)) * 100))) : 100;
      var barColor = ss === 'critico' ? 'var(--critical)' : (ss === 'alerta' ? 'var(--warning)' : 'var(--good)');
      return '<tr>' +
        '<td><div class="prod-name">' + esc(p.nombre) + '</div><div class="prod-meta">' + esc(p.laboratorio) + ' · Lote ' + esc(p.lote) + '</div></td>' +

        '<td><span class="' + vencPillClass(vs) + '">' + vencLabel(vs) + '</span><div class="prod-meta">' + fmtDate(p.vencimiento) + '</div></td>' +
        '<td><div class="stockcell"><span class="' + stockPillClass(ss) + '">' + stockLabel(p) + '</span><div class="stockbar"><span style="width:' + pct + '%;background:' + barColor + ';"></span></div></div></td>' +
        '<td>' + esc(p.ubicacion) + '</td>' +

        '</tr>';
    }).join('');
    var pager = totalPages > 1 ? renderPager(allRows.length, totalPages) : '';
    return '<div class="table-wrap"><table>' + head + '<tbody>' + body + '</tbody></table></div>' + pager;

  var FILTER_LABELS = { vencer:'Por vencer', vencidos:'Vencidos', stock:'Stock bajo' };

  function downloadPdf(){
    if(!(window.jspdf && window.jspdf.jsPDF)){
      toast('El generador de PDF todavía está cargando. Probá de nuevo en unos segundos.');
      return;
    }
    var rows = filteredRows();
    if(!rows.length){
      toast('No hay artículos para exportar con este filtro o búsqueda.');
      return;
    }
    var doc = new window.jspdf.jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    var todayIso = new Date().toISOString().slice(0,10);
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var margin = 32;

    doc.setFont('helvetica','bold');
    doc.setFontSize(16);
    doc.setTextColor(30,42,56);
    doc.text('Gestión de Inventario — Demo', margin, 38);

    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(90,102,112);
    var scopeBits = [];
    if(ui.search.trim()) scopeBits.push('búsqueda: "' + ui.search.trim() + '"');
    if(ui.filter !== 'todos') scopeBits.push('filtro: ' + (FILTER_LABELS[ui.filter] || ui.filter));
    if(ui.claseFilter) scopeBits.push('clase: ' + ui.claseFilter);
    if(ui.top10Filter) scopeBits.push('top 10 por valor');
    if(ui.provFilter) scopeBits.push('proveedor: ' + ui.provFilter);
    if(ui.tipoFilter) scopeBits.push('tipo: ' + ui.tipoFilter);
    var scopeNote = scopeBits.length ? scopeBits.join(' · ') : 'todos los artículos';
    doc.text('Generado el ' + fmtDate(todayIso) + ' · ' + scopeNote + ' · ' + rows.length + ' artículo' + (rows.length === 1 ? '' : 's'), margin, 53);

    var k = kpis();
    doc.text('Valor de inventario (todo el inventario): ' + fmtMoney(k.valor) + '   ·   Por vencer: ' + k.porVencer + '   ·   Stock bajo: ' + k.stockBajo, margin, 67);

    var head = [['Artículo','Tipo','Laboratorio / Lote','Vencimiento','Stock','Mín.','Ubicación','Costo','Precio venta','Valor en stock']];
    var body = rows.map(function(r){
      var p = r.p;
      return [
        p.nombre,
        tipoOf(p),
        p.laboratorio + (p.lote ? (' · ' + p.lote) : ''),
        vencLabel(r.vs) + (p.vencimiento ? ' (' + fmtDate(p.vencimiento) + ')' : ''),
        String(p.stock),
        (Number(p.stockMinimo) > 0 ? String(p.stockMinimo) : '—'),
        p.ubicacion || '—',
        fmtMoney(p.costo),
        fmtMoneyOrDash(p.precioVenta),
        fmtMoney(p.costo * p.stock)
      ];
    });

    var vencColors = { vencido:[122,35,35], critico:[178,58,52], alerta:[180,118,31], ok:[47,125,82], sinvencer:[91,102,112] };
    var stockColors = { critico:[178,58,52], alerta:[180,118,31], ok:[47,125,82] };

    doc.autoTable({
      head: head,
      body: body,
      startY: 82,
      margin: { left: margin, right: margin },
      styles: { font:'helvetica', fontSize:8.5, cellPadding:5, textColor:[30,42,56], lineColor:[215,220,218], lineWidth:0.5, overflow:'linebreak' },
      headStyles: { fillColor:[43,95,115], textColor:255, fontStyle:'bold' },
      alternateRowStyles: { fillColor:[245,246,244] },
      columnStyles: { 4:{ halign:'right' }, 5:{ halign:'right' }, 7:{ halign:'right' }, 8:{ halign:'right' }, 9:{ halign:'right' } },
      didParseCell: function(data){
        if(data.section !== 'body') return;
        var r = rows[data.row.index];
        if(!r) return;
        if(data.column.index === 3){
          data.cell.styles.textColor = vencColors[r.vs.key] || vencColors.ok;
          data.cell.styles.fontStyle = 'bold';
        }
        if(data.column.index === 4){
          data.cell.styles.textColor = stockColors[r.ss] || stockColors.ok;
          data.cell.styles.fontStyle = 'bold';
        }
      }
    });

    var totalPages = doc.internal.getNumberOfPages();
    for(var i = 1; i <= totalPages; i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(90,102,112);
      doc.text('Página ' + i + ' de ' + totalPages, pageWidth - margin, pageHeight - 14, { align:'right' });
    }

    var filename = 'inventario-demo-' + todayIso + '.pdf';
    function run(api){
      if(!api){ toast('La descarga no está disponible en esta vista.'); return; }
      api.save({ filename: filename, data: doc.output('blob') }).then(function(){
        toast('PDF descargado: ' + filename);
      }).catch(function(err){
        if(err && err.code === 'declined') return;
        toast('No se pudo generar la descarga. Probá de nuevo.');
      });
    }
    if(downloadsApi) run(downloadsApi); else downloadsReady.then(run);
  }

  function xlsIconSvg(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 8l8 8M16 8l-8 8"></path></svg>';
  }

  function downloadExcel(){
    if(!window.XLSX){
      toast('El generador de Excel todavía está cargando. Probá de nuevo en unos segundos.');
      return;
    }
    var rows = filteredRows();
    if(!rows.length){
      toast('No hay artículos para exportar con este filtro o búsqueda.');
      return;
    }
    var todayIso = new Date().toISOString().slice(0,10);
    var head = ['Artículo','Tipo','Laboratorio','Lote','Vencimiento','Vence en','Stock','Mínimo','Ubicación','Costo','Precio venta','Valor en stock'];
    var data = rows.map(function(r){
      var p = r.p;
      return [
        p.nombre, tipoOf(p), p.laboratorio || '', p.lote || '',
        p.vencimiento ? fmtDate(p.vencimiento) : '', vencLabel(r.vs),
        Number(p.stock) || 0, Number(p.stockMinimo) || 0, p.ubicacion || '',
        Number(p.costo) || 0, Number(p.precioVenta) || 0, (Number(p.costo)||0) * (Number(p.stock)||0)
      ];
    });
    var ws = window.XLSX.utils.aoa_to_sheet([head].concat(data));
    ws['!cols'] = [{wch:36},{wch:14},{wch:18},{wch:14},{wch:12},{wch:22},{wch:8},{wch:8},{wch:14},{wch:12},{wch:12},{wch:14}];
    var wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
    var wbout = window.XLSX.write(wb, { bookType:'xlsx', type:'array' });
    var blob = new Blob([wbout], { type:'application/octet-stream' });
    var filename = 'inventario-demo-' + todayIso + '.xlsx';
    function run(api){
      if(!api){ toast('La descarga no está disponible en esta vista.'); return; }
      api.save({ filename: filename, data: blob }).then(function(){
        toast('Excel descargado: ' + filename);
      }).catch(function(err){
        if(err && err.code === 'declined') return;
        toast('No se pudo generar la descarga. Probá de nuevo.');
      });
    }
    if(downloadsApi) run(downloadsApi); else downloadsReady.then(run);
  }

  function renderTabs(k){
    var tabs = [
      { key:'stock', label:'STOCK' },
      { key:'vencimientos', label:'VENCIMIENTOS', badge:k.porVencer },
      { key:'foco', label:'STOCK CRÍTICO', badge:k.stockBajo }
    ];
    return '<div class="tabs" role="tablist">' + tabs.map(function(t){
      var active = ui.tab === t.key;
      var badge = (t.badge != null && t.badge > 0) ? '<span class="tab-badge">' + t.badge + '</span>' : '';
      return '<button type="button" class="tab-btn" role="tab" data-tab="' + t.key + '" aria-selected="' + active + '">' + t.label + badge + '</button>';
    }).join('') + '</div>';
  }

  function renderTabContent(k){
    if(ui.tab === 'vencimientos'){
      return renderKpisVencimientos(k) + renderVencimientos365Panel() + renderVencimientosChart();
    }
    if(ui.tab === 'foco'){
      return renderKpisFoco(k) + renderStockBajoPanel();
    }
    return renderKpisStock(k) + renderToolbar() + renderTable() + renderStockConcentration();
  }

  function render(){
    var k = kpis();
    var html = '' +
    '<div class="topbar">' +
      '<div class="topbar-title">' +
        '<h1>Gestión de Inventario — Demo</h1>' +
        '<div class="subtext">Última actualización: ' + fmtDate(state.lastUpdated) + ' · Datos ficticios, solo para fines de demostración.</div>' +
      '</div>' +
      '<div class="topbar-controls">' +
        renderSearchBox('top') +
        '<button class="btn" id="btn-pdf" title="Descargar como PDF lo que está filtrado o buscado (o todo, si no hay filtro)"><span style="display:inline-flex;align-items:center;gap:6px;">' + pdfIconSvg() + 'PDF</span></button>' +
        '<button class="btn" id="btn-xlsx" title="Descargar como Excel lo que está filtrado o buscado (o todo, si no hay filtro)"><span style="display:inline-flex;align-items:center;gap:6px;">' + xlsIconSvg() + 'Excel</span></button>' +
      '</div>' +
    '</div>' +
    renderTabs(k) +
    renderTabContent(k);

    document.getElementById('app').innerHTML = html;
    wire();
  }

  function wire(){
    var app = document.getElementById('app');

    app.querySelectorAll('[data-search-id]').forEach(function(input){
      var suffix = input.getAttribute('data-search-id');
      input.addEventListener('input', function(e){
        ui.search = e.target.value; ui.searchFocusId = suffix; ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; render(); preserveFocus('search-input-' + suffix);
      });
      input.addEventListener('focus', function(){
        if(ui.searchFocusId !== suffix){ ui.searchFocusId = suffix; render(); preserveFocus('search-input-' + suffix); }
      });
      input.addEventListener('blur', function(){
        setTimeout(function(){
          var active = document.activeElement;
          var stillOnThisBox = active && active.id === ('search-input-' + suffix);
          if(!stillOnThisBox){ ui.searchFocusId = null; render(); }
        }, 150);
      });
    });
    app.querySelectorAll('[data-suggest]').forEach(function(btn){
      btn.addEventListener('click', function(){
        ui.search = btn.getAttribute('data-suggest');
        ui.searchFocusId = null;
        ui.page = 1;
        ui.vencPage = 1;
        ui.stockPage = 1;
        render();
      });
    });

    app.querySelectorAll('[data-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){ ui.filter = btn.getAttribute('data-filter'); ui.page = 1; render(); });
    });

    var clearClaseBtn = app.querySelector('[data-clear-clase]');
    if(clearClaseBtn) clearClaseBtn.addEventListener('click', function(){ ui.claseFilter = null; ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; render(); });

    app.querySelectorAll('[data-clase-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var c = btn.getAttribute('data-clase-filter');
        ui.claseFilter = (ui.claseFilter === c) ? null : c;
        ui.page = 1;
        ui.vencPage = 1;
        ui.stockPage = 1;
        render();
        if(ui.claseFilter){
          var tableWrap = document.querySelector('.table-wrap');
          if(tableWrap) tableWrap.scrollIntoView({ behavior:'smooth', block:'start' });
        }
      });
    });

    function scrollTableIntoView(){
      var tableWrap = document.querySelector('.table-wrap');
      if(tableWrap) tableWrap.scrollIntoView({ behavior:'smooth', block:'start' });
    }

    var clearTop10Btn = app.querySelector('[data-clear-top10]');
    if(clearTop10Btn) clearTop10Btn.addEventListener('click', function(){ ui.top10Filter = false; ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; render(); });

    var top10Btn = app.querySelector('[data-top10-filter]');
    if(top10Btn) top10Btn.addEventListener('click', function(){
      ui.top10Filter = !ui.top10Filter;
      ui.page = 1; ui.vencPage = 1; ui.stockPage = 1;
      if(ui.top10Filter) ui.tab = 'stock';
      render();
      if(ui.top10Filter) scrollTableIntoView();
    });

    var clearProvBtn = app.querySelector('[data-clear-prov]');
    if(clearProvBtn) clearProvBtn.addEventListener('click', function(){ ui.provFilter = null; ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; render(); });

    app.querySelectorAll('[data-prov-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var lab = btn.getAttribute('data-prov-filter');
        ui.provFilter = (ui.provFilter === lab) ? null : lab;
        ui.page = 1; ui.vencPage = 1; ui.stockPage = 1;
        render();
        if(ui.provFilter) scrollTableIntoView();
      });
    });

    var clearTipoBtn = app.querySelector('[data-clear-tipo]');
    if(clearTipoBtn) clearTipoBtn.addEventListener('click', function(){ ui.tipoFilter = null; ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; render(); });

    var labSelect = document.getElementById('lab-select');
    if(labSelect) labSelect.addEventListener('change', function(){
      ui.provFilter = labSelect.value || null;
      ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; ui.tab = 'stock';
      render();
      scrollTableIntoView();
    });

    var tipoSelect = document.getElementById('tipo-select');
    if(tipoSelect) tipoSelect.addEventListener('change', function(){
      ui.tipoFilter = tipoSelect.value || null;
      ui.page = 1; ui.vencPage = 1; ui.stockPage = 1; ui.tab = 'stock';
      render();
      scrollTableIntoView();
    });

    app.querySelectorAll('[data-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        ui.tab = btn.getAttribute('data-tab');
        render();
        window.scrollTo({ top:0, behavior:'smooth' });
      });
    });

    var clearMonthBtn = app.querySelector('[data-clear-month]');
    if(clearMonthBtn) clearMonthBtn.addEventListener('click', function(){ ui.monthFilter = null; ui.vencPage = 1; render(); });

    app.querySelectorAll('[data-month-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var raw = btn.getAttribute('data-month-filter');
        var key = raw === 'vencido' ? 'vencido' : Number(raw);
        ui.monthFilter = (ui.monthFilter === key) ? null : key;
        ui.vencPage = 1;
        render();
        var panel = document.getElementById('venc365-panel');
        if(panel) panel.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });

    app.querySelectorAll('[data-info-btn]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var key = btn.getAttribute('data-info-btn');
        ui.infoOpen = (ui.infoOpen === key) ? null : key;
        render();
      });
    });

    app.querySelectorAll('[data-sort]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-sort');
        if(ui.sortField === key){ ui.sortDir = ui.sortDir === 'asc' ? 'desc' : 'asc'; }
        else { ui.sortField = key; ui.sortDir = 'asc'; }
        ui.page = 1;
        render();
      });
    });

    var pdfBtn = document.getElementById('btn-pdf');
    if(pdfBtn) pdfBtn.addEventListener('click', downloadPdf);
    var xlsxBtn = document.getElementById('btn-xlsx');
    if(xlsxBtn) xlsxBtn.addEventListener('click', downloadExcel);

    var pagerPrev = document.getElementById('pager-prev');
    if(pagerPrev) pagerPrev.addEventListener('click', function(){ if(ui.page > 1){ ui.page -= 1; render(); } });
    var pagerNext = document.getElementById('pager-next');
    if(pagerNext) pagerNext.addEventListener('click', function(){ ui.page += 1; render(); });

    app.querySelectorAll('[data-panel-prev]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-panel-prev');
        if(ui[key] > 1){ ui[key] -= 1; render(); }
      });
    });
    app.querySelectorAll('[data-panel-next]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-panel-next');
        ui[key] += 1; render();
      });
    });

  }

  function preserveFocus(id){
    var el = document.getElementById(id);
    if(el){ el.focus(); var v = el.value; el.value=''; el.value=v; }
  }

  document.addEventListener('click', function(){
    if(ui.infoOpen){ ui.infoOpen = null; render(); }
  });

  render();
})();
</script>

</body></html>
